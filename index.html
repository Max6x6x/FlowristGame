<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3efe8">
<title>Növényismeret</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232f8f4e'/%3E%3Cpath d='M12 20c-3.5-2.4-6-4.9-6-8.6a6 6 0 0 1 12 0c0 3.7-2.5 6.2-6 8.6zM12 20v-8' fill='none' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,500;0,600;0,700;0,800;1,600;1,700;1,800&display=swap" rel="stylesheet">
<style>
:root {
  --ground: #f3efe8; --card: #ffffff; --sunk: #e8e2d7; --ink: #1d1b18; --ink-2: #5b564e; --ink-3: #6f695f;
  --go: #267a41; --go-ink: #ffffff; --go-soft: #e3f3e8; --go-text: #23703c;
  --almost: #9a5b00; --almost-soft: #fbeed4; --bad: #b3261e; --bad-soft: #fbe3e0;
  --r-s: 14px; --r-m: 20px; --r-l: 28px;
  --shadow: 0 1px 2px rgba(0, 0, 0, .07), 0 6px 18px rgba(0, 0, 0, .05);
  --bar-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground: #1b1916; --card: #262320; --sunk: #33302b; --ink: #f1ece4; --ink-2: #c3bbae; --ink-3: #a59d90;
    --go: #4fb06d; --go-ink: #0f1a12; --go-soft: #1f3a27; --go-text: #7fd197;
    --almost: #f0b44c; --almost-soft: #3d3020; --bad: #ff8a80; --bad-soft: #43231f;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 500 16px/1.45 Nunito, system-ui, sans-serif; min-height: 100dvh; }
::selection { background: var(--go-soft); color: var(--ink); }
:focus-visible { outline: 3px solid var(--go); outline-offset: 2px; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: default; }
input, select, textarea { font: inherit; color: var(--ink); caret-color: var(--go); }
.hidden { display: none !important; }

/* ---------- shell ---------- */
.top { display: flex; align-items: center; gap: 12px; padding: 14px 16px 6px; }
.brand { font-weight: 800; font-size: 20px; margin-right: auto; }
.chip { background: var(--card); border-radius: 14px; padding: 4px 12px; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; box-shadow: var(--shadow); }
main { padding: 0 16px calc(var(--bar-h) + 24px + env(safe-area-inset-bottom)); max-width: 1320px; margin: 0 auto; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: space-around; background: var(--card);
  padding: 8px 0 calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--sunk); }
.tabs button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 700; color: var(--ink-3); min-width: 72px; padding: 4px 0; }
.tabs button[aria-current="page"] { color: var(--go-text); }
.tabs svg { width: 24px; height: 24px; }

/* ---------- controls ---------- */
.seg { display: flex; background: var(--sunk); border-radius: var(--r-s); padding: 4px; }
.seg button { flex: 1; height: 38px; border: 0; border-radius: 10px; background: transparent; font-weight: 700; font-size: 14px; color: var(--ink-2); transition: background .2s, color .2s; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.selects { display: flex; gap: 8px; margin-top: 8px; }
select { flex: 1; min-width: 0; height: 40px; border: 0; border-radius: var(--r-s); background: var(--card); padding: 0 12px; font-weight: 600; font-size: 14px; box-shadow: var(--shadow); }
.btn { height: 52px; border: 0; border-radius: 16px; padding: 0 20px; font-weight: 800; font-size: 16px; transition: transform .15s cubic-bezier(.3,1.6,.5,1), background .2s; }
.btn:active:not(:disabled) { transform: scale(.96); }
.btn.go { background: var(--go); color: var(--go-ink); flex: 1; }
.btn.soft { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.btn.soft:disabled { color: var(--ink-3); box-shadow: none; background: var(--sunk); }
.badge { display: inline-block; min-width: 22px; margin-left: 6px; padding: 1px 7px; border-radius: 11px; background: var(--go-soft); color: var(--go-text); font-size: 13px; }

/* ---------- play ---------- */
.play { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; margin-top: 10px; }
.photo { position: relative; border-radius: var(--r-l); overflow: hidden; background: var(--sunk); height: min(42dvh, 460px); }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
.examstart { grid-column: 1 / -1; width: 100%; max-width: 560px; justify-self: center; gap: 8px; }
.examstart h2 { margin: 0; font-size: 26px; font-weight: 800; }
.examstart .dk { margin-top: 10px; }
.examhead { display: flex; align-items: center; gap: 12px; }
.examhead .roundrow { flex: 1; }
.quit { border: 0; background: none; font-weight: 700; font-size: 14px; color: var(--ink-2); min-height: 44px; padding: 0 8px; border-radius: 12px; }
.quit:hover { background: var(--sunk); color: var(--ink); }
.exrow { align-items: flex-start; }
.exrow.allok { opacity: .75; }
.exline { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.exline .dk { min-width: 54px; margin: 0; }
.exgiven { font-weight: 800; }
.exgiven.ok { color: var(--go-text); } .exgiven.almost { color: var(--almost); } .exgiven.bad { color: var(--bad); text-decoration: line-through; }
.exgiven mark { background: var(--almost); color: var(--card); border-radius: 4px; padding: 0 2px; }
.exgiven.blank { text-decoration: none; font-weight: 600; }
.exgiven em { font-style: normal; }
.excorrect { font-weight: 700; }
.detailnav { margin: 6px -8px 8px; align-items: center; }
.pager { display: flex; align-items: center; gap: 2px; font-weight: 800; font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.detail { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.detail .photo { height: min(48dvh, 520px); }
.dlat { margin: 0; font-style: italic; font-weight: 800; font-size: 28px; line-height: 1.15; overflow-wrap: anywhere; }
.dhu { font-weight: 700; font-size: 22px; overflow-wrap: anywhere; }
.dsec { margin-top: 14px; }
.dk { font-size: 13px; font-weight: 700; color: var(--ink-2); margin-bottom: 2px; }
.dnote { margin: 0; white-space: pre-line; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { background: var(--ground); border-radius: 10px; padding: 3px 10px; font-size: 14px; font-weight: 600; }
.detail .meta { font-size: 13px; color: var(--ink-2); margin-top: 14px; }
.plantnav { display: flex; justify-content: space-between; margin: -6px -8px 2px; }
.plantnav button { display: flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 10px; border: 0; border-radius: 12px; background: none; font-weight: 700; font-size: 14px; color: var(--ink-2); }
.plantnav button:hover:not(:disabled) { background: var(--ground); color: var(--ink); }
.plantnav button:disabled { opacity: .35; }
.stepper { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; align-items: center; gap: 2px; background: rgba(20, 18, 15, .62); border-radius: 24px; padding: 2px; }
.stepper button { width: 44px; height: 44px; border: 0; border-radius: 22px; background: none; color: #fff; display: grid; place-items: center; }
.stepper button:active { background: rgba(255, 255, 255, .18); }
.stepper .dots { display: flex; gap: 6px; padding: 0 4px; }
.stepper .dots i { width: 8px; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, .45); transition: width .2s, background .2s; }
.stepper .dots i.on { width: 20px; background: #fff; }
.photo img { touch-action: pan-y; }
.zoom { position: absolute; right: 12px; top: 12px; width: 44px; height: 44px; border: 0; border-radius: 22px; background: var(--card); color: var(--ink); display: grid; place-items: center; box-shadow: var(--shadow); }
.progress { position: absolute; left: 12px; top: 12px; }
.panel { background: var(--card); border-radius: var(--r-l); padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px; }
.field label { display: block; font-size: 13px; font-weight: 700; color: var(--ink-2); margin: 4px 0 4px 4px; }
.field input { width: 100%; height: 52px; border-radius: var(--r-s); border: 2px solid var(--sunk); background: var(--card); padding: 0 14px; font-weight: 700; font-size: 18px; outline: none; transition: border-color .2s, background .2s; }
.field input:focus { border-color: var(--go); }
.field.lat input { font-style: italic; }
.play.two .photo { height: min(31dvh, 460px); }
.done .field .hint { display: none; }
.roundrow { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 14px; color: var(--go-text); font-variant-numeric: tabular-nums; }
.roundbar { flex: 1; height: 8px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.roundbar > div { height: 100%; background: var(--go); border-radius: 3px; transition: width .4s cubic-bezier(.2,.8,.2,1); }
.field .hint { font-size: 15px; letter-spacing: .06em; color: var(--ink-2); padding: 4px 6px 0; white-space: pre-wrap; font-variant-numeric: tabular-nums; }
.field.ok input { background: var(--go-soft); border-color: var(--go-soft); }
.field.almost input { background: var(--almost-soft); border-color: var(--almost-soft); }
.field.bad input { background: var(--bad-soft); border-color: var(--bad-soft); }
.verdict { font-size: 14px; font-weight: 800; padding: 4px 6px 0; }
.verdict.ok { color: var(--go-text); } .verdict.almost { color: var(--almost); } .verdict.bad { color: var(--bad); }
.verdict mark { background: var(--almost); color: var(--card); border-radius: 4px; padding: 0 2px; }
.actions { display: flex; gap: 10px; margin-top: 8px; }
.solution { margin-top: 8px; background: var(--ground); border-radius: var(--r-m); padding: 16px 18px; animation: rise .35s cubic-bezier(.2,.8,.2,1); }
.solution .k { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.solution .lat { font-style: italic; font-weight: 800; font-size: 26px; line-height: 1.15; margin-top: 2px; overflow-wrap: anywhere; }
.solution .hu { font-weight: 700; font-size: 21px; overflow-wrap: anywhere; }
.solution .meta { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
.flag { color: var(--almost); font-weight: 700; font-size: 13px; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }

/* ---------- zoom overlay ---------- */
dialog.viewer { padding: 0; border: 0; width: 100vw; height: 100dvh; max-width: none; max-height: none; background: #0d0c0b; overflow: hidden; }
dialog.viewer::backdrop { background: #0d0c0b; }
dialog.viewer img { width: 100%; height: 100%; object-fit: contain; transition: transform .25s cubic-bezier(.2,.8,.2,1); cursor: zoom-in; touch-action: none; user-select: none; -webkit-user-drag: none; }
dialog.viewer img.zoomed { transform: scale(2.6); cursor: zoom-out; transition: transform .25s cubic-bezier(.2,.8,.2,1), transform-origin 0s; }
dialog.viewer .close { position: absolute; right: 16px; top: calc(16px + env(safe-area-inset-top)); width: 48px; height: 48px; border-radius: 24px; border: 0; background: rgba(255,255,255,.92); color: #1d1b18; display: grid; place-items: center; }
dialog.viewer .tip { position: absolute; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom)); text-align: center; color: rgba(255,255,255,.75); font-size: 14px; pointer-events: none; }

/* ---------- summary / list / admin ---------- */
.summary h2 { margin: 4px 0 4px; font-size: 26px; font-weight: 800; }
.rows { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.row { display: flex; gap: 12px; align-items: center; background: var(--ground); border-radius: var(--r-s); padding: 8px; border: 0; text-align: left; width: 100%; }
.row img, .row .noimg { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; flex: none; background: var(--sunk); }
.row .t { min-width: 0; }
.row i { display: block; font-weight: 800; overflow-wrap: anywhere; }
.row small { color: var(--ink-2); font-size: 13px; }
.search { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.search input { flex: 2 1 220px; height: 44px; border: 0; border-radius: var(--r-s); background: var(--card); padding: 0 14px; font-weight: 600; box-shadow: var(--shadow); outline: none; }
.search select { flex: 1 1 180px; height: 44px; }
.stats h2 { margin: 0; font-size: 20px; font-weight: 800; }
.stats .sum { color: var(--ink-2); font-size: 14px; margin: 2px 0 8px; }
.statrows { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 4px 20px; }
.stat { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; border: 0; background: none; text-align: left; padding: 8px 6px; border-radius: 12px; }
.stat:hover { background: var(--ground); }
.stat .n { font-weight: 600; font-size: 14px; line-height: 1.3; }
.stat .v { font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.stat .roundbar { grid-column: 1 / -1; flex: none; height: 6px; }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumb { position: relative; }
.thumb img { width: 84px; height: 84px; object-fit: cover; border-radius: 12px; display: block; }
.thumb button { position: absolute; top: -6px; right: -6px; width: 28px; height: 28px; border-radius: 14px; border: 0; background: var(--bad); color: #fff; display: grid; place-items: center; }
.count { color: var(--ink-2); font-size: 14px; margin: 10px 4px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 10px; }
.tile { background: var(--card); border: 0; border-radius: var(--r-m); overflow: hidden; padding: 0; text-align: left; box-shadow: var(--shadow); }
.tile img, .tile .noimg { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; background: var(--sunk); }
.tile div { padding: 8px 10px 10px; font-size: 14px; }
.tile i { display: block; font-weight: 800; }
.adm label { display: block; font-size: 13px; font-weight: 700; color: var(--ink-2); margin: 12px 0 4px 4px; }
.adm input:not([type]), .adm input[type="password"], .adm input[type="text"], .adm textarea { width: 100%; border: 2px solid var(--sunk); border-radius: var(--r-s); background: var(--card); padding: 10px 14px; font-weight: 600; outline: none; }
.adm input:focus, .adm textarea:focus { border-color: var(--go); }
.adm .photo { height: 260px; }
.check { display: flex; gap: 10px; align-items: center; font-weight: 700; margin-top: 12px; }
.check input { width: 22px; height: 22px; accent-color: var(--go); }
.muted { color: var(--ink-2); font-size: 14px; }
.msg { font-weight: 700; font-size: 14px; color: var(--ink-2); }
.empty { text-align: center; padding: 40px 16px; color: var(--ink-2); }

/* ---------- phone: action row always reachable by thumb ---------- */
@media (max-width: 899px) {
  .panel .actions { position: sticky; bottom: calc(var(--bar-h) + env(safe-area-inset-bottom) + 8px); z-index: 5; background: var(--card); margin: 8px -16px -16px; padding: 10px 16px 16px; border-radius: 0 0 var(--r-l) var(--r-l); }
  /* while typing, the keyboard needs the room: hide the tab bar, drop the row to the bottom */
  body:has(.field input:focus) .tabs { display: none; }
  body:has(.field input:focus) .panel .actions { bottom: 0; }
}

/* ---------- desktop: two-sided page ---------- */
@media (min-width: 900px) {
  .tabs { position: static; background: none; border: 0; padding: 0; justify-content: flex-start; gap: 6px; }
  .tabs button { flex-direction: row; gap: 8px; font-size: 15px; min-width: 0; padding: 8px 16px; border-radius: 12px; color: var(--ink-2); }
  .tabs button[aria-current="page"] { background: var(--go); color: var(--go-ink); }
  .tabs svg { width: 18px; height: 18px; }
  .top { padding: 16px 32px; gap: 20px; }
  .brand { margin-right: 12px; }
  .top .chip { margin-left: auto; }
  main { padding: 0 32px 32px; }
  /* two-sided page: photo left, controls + answers right */
  .play { grid-template-columns: minmax(0, 7fr) minmax(360px, 5fr); grid-template-rows: auto 1fr; grid-template-areas: "photo controls" "photo panel"; align-items: start; column-gap: 24px; row-gap: 12px; margin-top: 0; }
  .play > .controls { grid-area: controls; }
  .play > .photo { grid-area: photo; height: calc(100dvh - 104px); min-height: 420px; position: sticky; top: 16px; }
  .play > .panel { grid-area: panel; padding: 24px; }
  .play.two .photo { height: calc(100dvh - 104px); }
  .play > .panel.examstart, .play > .panel.summary { grid-column: 1 / -1; grid-row: 1 / -1; }
  .detail { grid-template-columns: minmax(0, 7fr) minmax(360px, 5fr); align-items: start; gap: 24px; }
  .detail .photo { height: calc(100dvh - 160px); min-height: 420px; position: sticky; top: 16px; }
  .detail .panel { padding: 28px; }
  .dlat { font-size: 36px; }
  .dhu { font-size: 26px; }
  .solution .lat { font-size: 34px; }
  .solution .hu { font-size: 24px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Növényismeret</div>
  <nav class="tabs" aria-label="Fő menü">
    <button data-tab="play" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21c-4.5-3-8-6.2-8-11a8 8 0 0 1 16 0c0 4.8-3.5 8-8 11z"/><path d="M12 21V11"/></svg>Gyakorlás</button>
    <button data-tab="exam">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 12l2 2 4-4"/></svg>Vizsga</button>
    <button data-tab="list">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>Tanulás</button>
    <button data-tab="admin">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>Admin</button>
  </nav>
  <div class="chip" id="today" title="Ma helyes / összes">0 / 0</div>
</header>

<main>
  <!-- PLAY -->
  <section id="play">
    <div class="play" id="playArea"></div>
  </section>

  <!-- LIST -->
  <section id="exam" class="hidden">
    <div class="play" id="examArea"></div>
  </section>

  <section id="list" class="hidden">
    <div id="lMain">
      <div class="panel stats" id="stats" style="margin-top:10px"></div>
      <div class="search">
        <input id="lQ" type="search" placeholder="Keresés latin vagy magyar névre…" aria-label="Keresés">
        <select id="lCat" aria-label="Kategória"></select>
      </div>
      <p class="count" id="lCount"></p>
      <div class="grid" id="lGrid"></div>
    </div>
    <div id="lDetail" class="hidden"></div>
  </section>

  <!-- ADMIN -->
  <section id="admin" class="hidden adm">
    <div class="panel" style="margin-top:10px">
      <div id="tokSet" class="hidden">
        <p style="margin:0;font-weight:800">A mentés be van állítva ezen az eszközön.</p>
        <p class="muted">A javításaid azonnal itt látszanak, a többi eszközön 1–2 perc múlva.</p>
        <div class="actions">
          <button class="btn soft" id="tokForget">Kijelentkezés</button>
          <button class="btn go" id="tokLink">Link másik eszközre</button>
        </div>
        <p class="msg" id="tokMsg" aria-live="polite"></p>
      </div>
      <div id="tokUnset">
        <label for="aTok">GitHub token</label>
        <input id="aTok" type="password" autocomplete="off">
        <p class="muted">Egyszer kell megadni eszközönként — vagy nyisd meg a kapott „mentés” linket ezen az eszközön.</p>
      </div>
    </div>
    <div class="search">
      <input id="aQ" type="search" placeholder="Növény keresése…" aria-label="Növény keresése">
      <select id="aFilter" aria-label="Szűrő">
        <option value="">Mind</option>
        <option value="verify">Ellenőrizendő magyar név</option>
        <option value="nohu">Nincs magyar név</option>
        <option value="noimg">Nincs kép</option>
      </select>
    </div>
    <div class="panel hidden" id="aEdit" style="margin-top:12px"></div>
    <p class="count" id="aCount"></p>
    <div class="rows" id="aList"></div>
  </section>
</main>

<dialog class="viewer" id="viewer" aria-label="Nagyított kép">
  <button class="close" id="viewerClose" aria-label="Bezárás">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div class="tip">Koppints a nagyításhoz, húzd a mozgatáshoz</div>
</dialog>

<script>
const REPO = "Max6x6x/FlowristGame";
let plants = [];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const ICON = {
  zoom: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4M11 8v6M8 11h6"/></svg>',
};

// ---------- answer checking ----------
const norm = s => String(s).toLowerCase().replace(/[‘’'"`.]/g, "").replace(/\s+/g, " ").trim();
const deacc = s => s.normalize("NFD").replace(/\p{M}/gu, "");
function latinVariants(p) {
  const l = p.latin, v = [l, l.replace(/\([^)]*\)/g, "")];
  l.split("/").forEach(x => v.push(x));
  (l.match(/\(([^)]*)\)/g) || []).forEach(x => { if (x.includes(" ")) v.push(x.slice(1, -1)); });
  return v;
}
// -> { r: "ok" | "almost" (only accents/diacritics differ) | "bad", target: best matching variant }
function check(answer, variants) {
  const a = norm(answer), vs = variants.filter(Boolean);
  if (!a) return { r: "bad", target: vs[0] };
  const hit = vs.find(v => norm(v) === a);
  if (hit) return { r: "ok", target: hit };
  const near = vs.find(v => deacc(norm(v)) === deacc(a));
  if (near) return { r: "almost", target: near };
  return { r: "bad", target: vs[0] };
}
// her answer with the differing letters marked (only when letter-by-letter comparable)
function markDiff(answer, target) {
  const a = answer.trim().replace(/\s+/g, " "), t = target.replace(/\s+/g, " ").trim();
  if (a.length !== t.length) return esc(a);
  return [...a].map((c, i) => c.toLowerCase() === t[i].toLowerCase() ? esc(c) : `<mark>${esc(c)}</mark>`).join("");
}

// ---------- hints: 1st press = letter count per word, then one more letter each press ----------
function hintText(name, level) {
  if (level < 1) return "";
  let shown = level - 1;
  return name.trim().split(/\s+/).map(w => [...w].map(c => !/\p{L}/u.test(c) ? c : shown-- > 0 ? c : "_").join(" ")).join("   ");
}

// ---------- spaced repetition (Leitner boxes 0..5; stamps = last answer time, for syncing) ----------
let boxes = store.get("boxes", {});
let stamps = store.get("stamps", {});
const isWeak = id => boxes[id] !== undefined && boxes[id] <= 1;
const isLearned = id => (boxes[id] ?? 0) >= 3;
function pick(pool, avoidId) {
  const cands = pool.length > 1 ? pool.filter(p => p.id !== avoidId) : pool;
  const w = cands.map(p => 2 ** (5 - (boxes[p.id] ?? 0)));
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < cands.length; i++) if ((r -= w[i]) <= 0) return cands[i];
  return cands[cands.length - 1];
}
function grade(id, results, hints) {
  const b = boxes[id] ?? 0;
  const clean = results.every(r => r === "ok") && hints < 2;
  boxes[id] = clean ? Math.min(5, b + 1) : results.includes("bad") ? 0 : b;
  stamps[id] = Date.now();
  store.set("boxes", boxes); store.set("stamps", stamps);
  progDirty = true;
}

// ---------- progress sync: progress.json on the "progress" branch (no Pages rebuilds), only with a token ----------
let progSha = null, progDirty = false;
const fromB64 = b => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g, "")), c => c.charCodeAt(0)));
function mergeProgress(remote) {
  for (const [id, t] of Object.entries(remote.stamps || {})) {
    if ((stamps[id] ?? 0) < t) { boxes[id] = remote.boxes[id]; stamps[id] = t; }
  }
  // anything newer here than there needs pushing
  progDirty = progDirty || Object.entries(stamps).some(([id, t]) => (remote.stamps?.[id] ?? 0) < t);
  store.set("boxes", boxes); store.set("stamps", stamps);
}
async function pullProgress() {
  if (!tok()) return;
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/progress.json?ref=progress`,
      { cache: "no-store", headers: { Authorization: `Bearer ${tok()}`, Accept: "application/vnd.github+json" } });
    if (r.status === 404) { progDirty = progDirty || Object.keys(stamps).length > 0; return; }
    if (!r.ok) return;
    const j = await r.json();
    progSha = j.sha;
    mergeProgress(JSON.parse(fromB64(j.content)));
  } catch {}
}
async function pushProgress() {
  if (!tok() || !progDirty) return;
  progDirty = false;
  const content = bytesToB64(new TextEncoder().encode(JSON.stringify({ boxes, stamps })));
  try {
    const r = await gh("progress.json", { method: "PUT", body: JSON.stringify({ message: "Haladás mentése", content, branch: "progress", ...(progSha ? { sha: progSha } : {}) }) });
    progSha = r.content.sha;
  } catch {
    progDirty = true;
    await pullProgress(); // probably saved from another device meanwhile: merge, retry next tick
  }
}
setInterval(pushProgress, 60000);
document.addEventListener("visibilitychange", () => document.hidden ? pushProgress() : pullProgress());

// ---------- settings + today counter ----------
const settings = Object.assign({ mode: "both", cat: "", round: "0" }, store.get("settings", {}));
const saveSettings = () => store.set("settings", settings);
const todayKey = new Date().toISOString().slice(0, 10);
let today = store.get("today", {});
if (today.d !== todayKey) today = { d: todayKey, ok: 0, n: 0 };
const renderToday = () => { $("#today").textContent = `ma ${today.ok} / ${today.n}`; };

// ---------- play ----------
let round = null;   // { size, items: [], answers: [] } when a fixed-length round is running
let current = null; // { p, hints, done, results }
let lastId = null;
const WEAK = "__weak";
function pool() {
  return plants.filter(p => p.image && (settings.mode !== "hu" || p.hu) &&
    (!settings.cat || (settings.cat === WEAK ? isWeak(p.id) : p.categories.includes(settings.cat))));
}
// primary photo plus extra iNaturalist photos; one is chosen at random per question
const photosOf = p => [{ image: p.image, credit: p.credit }, ...(p.more || [])].filter(x => x.image);
// plants shown in continuous mode, so "Előző" can step back and "Következő" forward again
let shown = [], hpos = -1;
function startRound() {
  const size = +settings.round;
  round = size ? { size, items: [...pool()].sort(() => Math.random() - .5).slice(0, size), answers: [] } : null;
  shown = []; hpos = -1;
  next();
}
function showPlant(p) {
  lastId = p.id;
  const ph = photosOf(p);
  const idx = Math.floor(Math.random() * ph.length);
  current = { p, photos: ph, idx, photo: ph[idx], hints: 0, done: false, results: [] };
  renderPlay();
}
function next() {
  if (round && round.answers.length >= round.items.length) return summary();
  const pl = pool();
  if (!pl.length) { current = null; return renderPlay(); }
  if (round) return showPlant(round.items[round.answers.length]);
  if (hpos < shown.length - 1) return showPlant(shown[++hpos]);
  shown.push(pick(pl, lastId)); hpos = shown.length - 1;
  showPlant(shown[hpos]);
}
function prev() { if (!round && hpos > 0) showPlant(shown[--hpos]); }
// skip without grading; in a round the plant goes to the back of the queue
function skip() {
  if (round) round.items.push(round.items.splice(round.answers.length, 1)[0]);
  next();
}
function controlsHtml() {
  const seg = [["lat", "Latin"], ["hu", "Magyar"], ["both", "Mindkettő"]]
    .map(([v, t]) => `<button data-mode="${v}" aria-pressed="${settings.mode === v}">${t}</button>`).join("");
  const weak = plants.filter(p => p.image && isWeak(p.id)).length;
  const cats = `<option value="">Minden kategória</option><option value="${WEAK}"${settings.cat === WEAK ? " selected" : ""}>Csak a hibásak (${weak})</option>` + categories().map(c => `<option${c === settings.cat ? " selected" : ""}>${esc(c)}</option>`).join("");
  const rounds = [["0", "Folyamatos"], ["20", "20-as kör"], ["50", "50-es vizsgakör"]]
    .map(([v, t]) => `<option value="${v}"${v === settings.round ? " selected" : ""}>${t}</option>`).join("");
  return `<div class="controls"><div class="seg" role="group" aria-label="Mit írjak?">${seg}</div>
    <div class="selects"><select id="pCat" aria-label="Kategória">${cats}</select><select id="pRound" aria-label="Kör hossza">${rounds}</select></div></div>`;
}
function bindControls() {
  document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { settings.mode = b.dataset.mode; saveSettings(); startRound(); });
  $("#pCat").onchange = e => { settings.cat = e.target.value; saveSettings(); startRound(); };
  $("#pRound").onchange = e => { settings.round = e.target.value; saveSettings(); startRound(); };
}
function renderPlay() {
  const area = $("#playArea");
  if (!current) {
    const why = settings.cat === WEAK ? "Most nincs hibás növényed. Gyakorolj tovább, és amit elrontasz, itt jön vissza." : "Ebben a kategóriában még nincs képes növény.";
    area.innerHTML = `<div class="panel">${controlsHtml()}<p class="empty">${why}</p></div>`;
    return bindControls();
  }
  const { p } = current;
  const needLat = settings.mode !== "hu", needHu = settings.mode !== "lat" && !!p.hu;
  const prog = "";
  const n = round ? round.answers.length + 1 : 0;
  const bar = round ? `<div class="roundrow"><div class="roundbar" role="progressbar" aria-label="Kör" aria-valuemin="1" aria-valuemax="${round.items.length}" aria-valuenow="${n}"><div style="width:${n / round.items.length * 100}%"></div></div><span>${n} / ${round.items.length}</span></div>` : "";
  area.classList.toggle("two", needLat && needHu);
  area.classList.remove("done");
  const field = (cls, id, label) => `<div class="field ${cls}" id="f-${id}">
      <label for="in-${id}">${label}</label>
      <input id="in-${id}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="${id === "lat" && needHu ? "next" : "done"}">
      <div class="hint" id="h-${id}" aria-live="polite"></div><div class="verdict" id="v-${id}" aria-live="polite"></div></div>`;
  area.innerHTML = `
    ${controlsHtml()}
    <div class="photo">
      <img src="${esc(current.photo.image)}" alt="Felismerendő növény" id="pImg">
      <div class="stepper" id="pStep"></div>
      ${prog}
      <button class="zoom" id="pZoom" aria-label="Kép nagyítása">${ICON.zoom}</button>
    </div>
    <div class="panel">
      <div class="plantnav">
        <button id="pPrev"${round || hpos < 1 ? " disabled" : ""}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Előző</button>
        <button id="pSkip">Kihagyás<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      ${bar}
      ${needLat ? field("lat", "lat", "Latin név") : ""}
      ${needHu ? field("hu", "hu", "Hivatalos magyar név") : ""}
      <div class="actions">
        <button class="btn soft" id="pHint">Súgó<span class="badge hidden" id="pHintN"></span></button>
        <button class="btn go" id="pCheck">Mutasd!</button>
      </div>
      <div id="pSolution"></div>
    </div>`;
  bindControls();
  current.gallery = gallery($("#pImg"), $("#pStep"), current.photos, current.idx, ph => {
    current.photo = ph;
    const credit = $("#pCredit");
    if (credit) credit.textContent = ph.credit ? ` · Kép: ${ph.credit}` : "";
  });
  $("#pZoom").onclick = () => openViewer(current.photo.image);
  $("#pHint").onclick = hint;
  $("#pPrev").onclick = prev;
  $("#pSkip").onclick = () => current.done ? next() : skip();
  $("#pCheck").onclick = () => current.done ? next() : reveal();
  const inputs = [...area.querySelectorAll(".field input")];
  inputs.forEach((x, i) => x.onkeydown = e => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    if (current.done) return next();
    if (inputs[i + 1] && !inputs[i + 1].value) inputs[i + 1].focus(); else reveal();
  });
  // don't pop the phone keyboard over the photo; on desktop start typing right away
  if (matchMedia("(min-width: 900px)").matches) inputs[0]?.focus();
}
// ---------- photo gallery: arrows + dots under the photo, swipe, tap = zoom (practice and detail page) ----------
function gallery(img, stepEl, photos, idx, onChange) {
  const g = { idx };
  const draw = () => {
    const n = photos.length;
    stepEl.classList.toggle("hidden", n < 2);
    if (n < 2) { stepEl.innerHTML = ""; return; }
    const arrow = (d, label, path) => `<button data-step="${d}" aria-label="${label}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${path}"/></svg></button>`;
    stepEl.innerHTML = arrow(-1, "Előző kép", "M15 5l-7 7 7 7")
      + `<span class="dots" aria-label="${g.idx + 1}. kép a ${n}-ből">${photos.map((_, i) => `<i${i === g.idx ? ' class="on"' : ""}></i>`).join("")}</span>`
      + arrow(1, "Következő kép", "M9 5l7 7-7 7");
  };
  g.show = i => {
    const n = photos.length;
    g.idx = ((i % n) + n) % n;
    img.src = photos[g.idx].image;
    draw();
    onChange?.(photos[g.idx]);
  };
  stepEl.onclick = e => { const b = e.target.closest("[data-step]"); if (b) g.show(g.idx + +b.dataset.step); };
  // a hotlinked extra photo that fails to load is dropped from the set
  img.onerror = () => { if (photos.length > 1) { photos.splice(g.idx, 1); g.show(g.idx); } };
  // swipe left/right steps; a tap (no swipe) opens the zoom viewer
  let x0 = null, swiped = false;
  img.onpointerdown = e => { x0 = e.clientX; swiped = false; };
  img.onpointerup = e => {
    if (x0 !== null && Math.abs(e.clientX - x0) > 40 && photos.length > 1) { swiped = true; g.show(g.idx + (e.clientX < x0 ? 1 : -1)); }
    x0 = null;
  };
  img.onclick = () => { if (!swiped) openViewer(photos[g.idx].image); };
  draw();
  return g;
}
function hint() {
  if (current.done) return;
  current.hints++;
  const { p } = current;
  // each word stays on one line; lines may only break between words
  const show = (el, name) => { if (el) el.innerHTML = hintText(name, current.hints).split("   ").map(w => `<span style="white-space:nowrap">${esc(w)}</span>`).join("   "); };
  show($("#h-lat"), p.latin.replace(/\s*\([^)]*\)|\s*\/.*$/g, ""));
  show($("#h-hu"), p.hu);
  $("#pHintN").textContent = current.hints;
  $("#pHintN").classList.remove("hidden");
}
const VERDICT = { ok: "Helyes!", almost: "Majdnem — ékezet vagy betű eltér", bad: "Nem ez" };
function reveal() {
  const { p } = current;
  current.done = true;
  $("#playArea").classList.add("done");
  const results = [];
  for (const [id, variants] of [["lat", [...latinVariants(p), ...(p.aliases || [])]], ["hu", [p.hu, ...(p.aliases || [])]]]) {
    const inp = $(`#in-${id}`);
    if (!inp) continue;
    const { r, target } = check(inp.value, variants);
    results.push(r);
    $(`#f-${id}`).classList.add(r);
    inp.readOnly = true;
    const v = $(`#v-${id}`);
    v.className = "verdict " + r;
    v.innerHTML = r === "almost" ? `${VERDICT[r]}: ${markDiff(inp.value, target)}` : r === "bad" && inp.value.trim() ? `${VERDICT[r]}` : r === "bad" ? "Üresen maradt" : VERDICT[r];
  }
  current.results = results;
  grade(p.id, results, current.hints);
  today.n++; if (results.every(r => r === "ok")) today.ok++;
  store.set("today", today); renderToday();
  if (round) round.answers.push({ p, results, hints: current.hints });
  $("#pSolution").innerHTML = solutionHtml(p, current.photo.credit);
  $("#pHint").disabled = true;
  $("#pSkip").classList.add("hidden");
  $("#pCheck").textContent = round && round.answers.length >= round.items.length ? "Eredmény" : "Következő";
  $("#pCheck").focus();
}
function solutionHtml(p, credit) {
  return `<div class="solution">
    <div class="lat">${esc(p.latin)}</div>
    <div class="hu">${esc(p.hu) || '<span class="muted">nincs magyar név megadva</span>'}</div>
    ${p.verify ? '<div class="flag">Automatikusan talált név — az Adminban ellenőrizd</div>' : ""}
    ${p.aliases?.length ? `<div class="meta">Más néven: ${esc(p.aliases.join(", "))}</div>` : ""}
    ${p.note ? `<div class="meta">${esc(p.note)}</div>` : ""}
    <div class="meta">${esc(p.categories.join(" · "))}<span id="pCredit">${credit ? ` · Kép: ${esc(credit)}` : ""}</span></div>
  </div>`;
}
function summary() {
  const total = round.answers.reduce((s, a) => s + a.results.length, 0);
  const good = round.answers.reduce((s, a) => s + a.results.filter(r => r === "ok").length, 0);
  const missed = round.answers.filter(a => !a.results.every(r => r === "ok"));
  $("#playArea").innerHTML = `<div class="panel summary" style="grid-column: 1 / -1">
    <h2>${good} / ${total} helyes név (${Math.round(good / Math.max(1, total) * 100)}%)</h2>
    <p class="muted">${round.items.length} növény · súgót ${round.answers.filter(a => a.hints).length}-nál használtál</p>
    <div class="actions"><button class="btn go" id="sAgain">Új kör</button></div>
    ${missed.length ? `<div class="rows">${missed.map(a => `<div class="row">
      <img src="${esc(a.p.image)}" alt=""><div class="t"><i>${esc(a.p.latin)}</i><small>${esc(a.p.hu)}</small></div></div>`).join("")}</div>` : '<p class="empty">Mind hibátlan!</p>'}
  </div>`;
  $("#sAgain").onclick = startRound;
  pushProgress();
}

// ---------- zoom viewer: tap to zoom at that point, drag to pan ----------
const viewer = $("#viewer"), vImg = new Image();
vImg.alt = "Nagyított kép a felismerendő növényről";
vImg.draggable = false;
viewer.prepend(vImg);
function openViewer(src) { vImg.src = src; vImg.classList.remove("zoomed"); viewer.showModal(); }
function setOrigin(e) {
  const r = vImg.getBoundingClientRect();
  vImg.style.transformOrigin = `${((e.clientX - r.left) / r.width) * 100}% ${((e.clientY - r.top) / r.height) * 100}%`;
}
vImg.onclick = e => { setOrigin(e); vImg.classList.toggle("zoomed"); };
vImg.onpointermove = e => { if (vImg.classList.contains("zoomed")) setOrigin(e); };
$("#viewerClose").onclick = () => viewer.close();

// ---------- list ----------
function categories() { return [...new Set(plants.flatMap(p => p.categories))]; }
// progress per category: learned = 3+ clean answers in a row (Leitner box >= 3)
function renderStats() {
  const withImg = plants.filter(p => p.image);
  const learned = withImg.filter(p => isLearned(p.id)).length, weak = withImg.filter(p => isWeak(p.id)).length;
  const rows = categories().map(c => {
    const ps = withImg.filter(p => p.categories.includes(c)), l = ps.filter(p => isLearned(p.id)).length;
    return { c, l, n: ps.length };
  }).filter(r => r.n);
  $("#stats").innerHTML = `<h2>Haladás</h2>
    <p class="sum">${learned} / ${withImg.length} növényt tudsz · ${weak} hibás vár ismétlésre · koppints egy kategóriára a gyakorláshoz</p>
    <div class="statrows">${rows.map(r => `<button class="stat" data-cat="${esc(r.c)}">
      <span class="n">${esc(r.c)}</span><span class="v">${r.l} / ${r.n}</span>
      <span class="roundbar" aria-hidden="true"><div style="width:${r.l / r.n * 100}%"></div></span></button>`).join("")}</div>`;
}
function renderList() {
  renderStats();
  const q = deacc(norm($("#lQ").value)), cat = $("#lCat").value;
  const rows = plants.filter(p => (!cat || p.categories.includes(cat)) &&
    (!q || deacc(norm([p.latin, p.hu, ...(p.aliases || [])].join(" "))).includes(q)));
  listRows = rows;
  $("#lCount").textContent = `${rows.length} növény`;
  $("#lGrid").innerHTML = rows.map(p => `<button class="tile" data-id="${p.id}">
    ${p.image ? `<img loading="lazy" src="${esc(p.image)}" alt="">` : '<div class="noimg"></div>'}
    <div><i>${esc(p.latin)}</i>${esc(p.hu)}${p.verify ? ' <span class="flag">(?)</span>' : ""}</div></button>`).join("");
}

// ---------- exam: pick mode + size, answer without hints or feedback, evaluation at the end ----------
let exam = null; // { mode, items, answers: [{ p, lat, hu }], done }
const examSet = Object.assign({ mode: "both", size: "20" }, store.get("examSet", {}));
function examStart() {
  exam = null;
  const seg = (key, opts) => `<div class="seg" role="group">${opts.map(([v, t]) =>
    `<button data-${key}="${v}" aria-pressed="${examSet[key] === v}">${t}</button>`).join("")}</div>`;
  $("#examArea").className = "play";
  $("#examArea").innerHTML = `<div class="panel examstart">
    <h2>Vizsga</h2>
    <p class="muted">Mint a valódi vizsgán: súgó és visszajelzés nélkül. A végén megmutatjuk, mit írtál jól és mit rosszul.</p>
    <div class="dk">Mit kell írni?</div>
    ${seg("mode", [["lat", "Latin"], ["hu", "Magyar"], ["both", "Mindkettő"]])}
    <div class="dk">Hány növény?</div>
    ${seg("size", [["20", "20 növény"], ["50", "50 növény"]])}
    <div class="actions"><button class="btn go" id="exGo">Vizsga indítása</button></div>
  </div>`;
  $("#examArea").querySelectorAll("[data-mode],[data-size]").forEach(b => b.onclick = () => {
    const key = b.dataset.mode ? "mode" : "size";
    examSet[key] = b.dataset[key]; store.set("examSet", examSet);
    b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
  });
  $("#exGo").onclick = () => {
    const pool = plants.filter(p => p.image && (examSet.mode !== "hu" || p.hu));
    exam = { mode: examSet.mode, items: [...pool].sort(() => Math.random() - .5).slice(0, +examSet.size), answers: [], done: false };
    examQuestion();
  };
}
function examQuestion() {
  const area = $("#examArea"), n = exam.answers.length, total = exam.items.length;
  if (n >= total) return examResult();
  const p = exam.items[n], needLat = exam.mode !== "hu", needHu = exam.mode !== "lat" && !!p.hu;
  const photos = photosOf(p);
  area.className = "play" + (needLat && needHu ? " two" : "");
  const field = (id, label, cls) => `<div class="field ${cls}"><label for="ex-${id}">${label}</label>
    <input id="ex-${id}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="${id === "lat" && needHu ? "next" : "done"}"></div>`;
  area.innerHTML = `
    <div class="controls examhead">
      <div class="roundrow"><div class="roundbar" role="progressbar" aria-label="Vizsga" aria-valuemin="1" aria-valuemax="${total}" aria-valuenow="${n + 1}"><div style="width:${(n + 1) / total * 100}%"></div></div><span>${n + 1} / ${total}</span></div>
      <button class="quit" id="exQuit">Kilépés</button>
    </div>
    <div class="photo">
      <img id="exImg" src="${esc(photos[0].image)}" alt="Felismerendő növény">
      <div class="stepper" id="exStep"></div>
      <button class="zoom" id="exZoom" aria-label="Kép nagyítása">${ICON.zoom}</button>
    </div>
    <div class="panel">
      ${needLat ? field("lat", "Latin név", "lat") : ""}
      ${needHu ? field("hu", "Hivatalos magyar név", "hu") : ""}
      <div class="actions"><button class="btn go" id="exNext">${n + 1 === total ? "Befejezés" : "Tovább"}</button></div>
    </div>`;
  const g = gallery($("#exImg"), $("#exStep"), photos, Math.floor(Math.random() * photos.length), null);
  g.show(g.idx);
  $("#exZoom").onclick = () => openViewer(photos[g.idx].image);
  const go = () => {
    exam.answers.push({ p, lat: needLat ? $("#ex-lat").value : null, hu: needHu ? $("#ex-hu").value : null });
    examQuestion(); window.scrollTo(0, 0);
  };
  $("#exNext").onclick = go;
  $("#exQuit").onclick = () => { if (confirm("Biztosan kilépsz? Ennek a vizsgának a válaszai elvesznek.")) examStart(); };
  const inputs = [...area.querySelectorAll(".field input")];
  inputs.forEach((x, i) => x.onkeydown = e => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    if (inputs[i + 1]) inputs[i + 1].focus(); else go();
  });
  if (matchMedia("(min-width: 900px)").matches) inputs[0]?.focus();
}
function examResult() {
  if (!exam.done) {
    exam.done = true;
    for (const a of exam.answers) {
      a.res = {};
      if (a.lat !== null) a.res.lat = check(a.lat, [...latinVariants(a.p), ...(a.p.aliases || [])]);
      if (a.hu !== null) a.res.hu = check(a.hu, [a.p.hu, ...(a.p.aliases || [])]);
      grade(a.p.id, Object.values(a.res).map(x => x.r), 0);
    }
    pushProgress();
  }
  const fields = exam.answers.flatMap(a => Object.values(a.res));
  const good = fields.filter(x => x.r === "ok").length;
  const plantsOk = exam.answers.filter(a => Object.values(a.res).every(x => x.r === "ok")).length;
  const line = (label, given, r, correct) => {
    const shown = r.r === "almost" ? markDiff(given, r.target) : esc(given.trim()) || "<em>üres</em>";
    return `<div class="exline"><span class="dk">${label}</span>
      <span class="exgiven ${r.r}${given.trim() ? "" : " blank"}">${shown}</span>${r.r === "ok" ? "" : ` <span class="excorrect">→&nbsp;${esc(correct)}</span>`}</div>`;
  };
  const rows = [...exam.answers].sort((a, b) => Object.values(a.res).every(x => x.r === "ok") - Object.values(b.res).every(x => x.r === "ok"));
  $("#examArea").className = "play";
  $("#examArea").innerHTML = `<div class="panel summary">
    <h2>${good} / ${fields.length} helyes név (${Math.round(good / Math.max(1, fields.length) * 100)}%)</h2>
    <p class="muted">${plantsOk} / ${exam.answers.length} növény teljesen hibátlan · elöl a hibásak</p>
    <div class="actions"><button class="btn go" id="exAgain">Új vizsga</button></div>
    <div class="rows">${rows.map(a => {
      const allOk = Object.values(a.res).every(x => x.r === "ok");
      return `<div class="row exrow${allOk ? " allok" : ""}"><img src="${esc(a.p.image)}" alt="">
        <div class="t">
          ${a.res.lat ? line("Latin", a.lat, a.res.lat, a.p.latin) : ""}
          ${a.res.hu ? line("Magyar", a.hu, a.res.hu, a.p.hu) : ""}
        </div></div>`;
    }).join("")}</div>
  </div>`;
  $("#exAgain").onclick = examStart;
  window.scrollTo(0, 0);
}

// ---------- list detail page: read-only learning view of one plant ----------
let listRows = [], listScroll = 0, detailId = null;

}

        ${p.note ? `<div class="dsec"><div class="dk">Jegyzet</div><p class="dnote">${esc(p.note)}</p></div>` : ""}
        <div class="dsec"><div class="dk">Kategória</div><div class="chips">${p.categories.map(c => `<span class="tag">${esc(c)}</span>`).join("")}</div></div>
        <div class="dsec"><div class="dk">Hol tartasz</div>${knowText(p.id)}</div>

// phone back gesture / browser back closes the detail page

// ---------- admin: commits data.json + images through the GitHub contents API ----------
const tok = () => store.get("ghToken", "");
async function gh(path, opts = {}) {
  const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
    ...opts, cache: "no-store", headers: { Authorization: `Bearer ${tok()}`, Accept: "application/vnd.github+json" },
  });
  if (!r.ok) {
    const m = (await r.json().catch(() => ({}))).message || "";
    throw new Error(r.status === 401 ? "érvénytelen token" : r.status === 409 ? "közben máshol is mentettél, próbáld újra" : `GitHub ${r.status} ${m}`);
  }
  return r.json();
}
function bytesToB64(bytes) { let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000)); return btoa(s); }
async function getDataFile() {
  // contents API omits content for files > 1 MB, so read the blob instead
  const meta = await gh("data.json");
  const blob = await fetch(meta.git_url, { headers: { Authorization: `Bearer ${tok()}` } }).then(r => r.json());
  const bin = atob(blob.content.replace(/\n/g, ""));
  return { sha: meta.sha, data: JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)))) };
}
async function resizeToJpeg(file, max = 1200) {
  const img = await createImageBitmap(file);
  const k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", .86));
  return { b64: bytesToB64(new Uint8Array(await blob.arrayBuffer())), url: URL.createObjectURL(blob) };
}
function renderAdminList() {
  const q = deacc(norm($("#aQ").value)), f = $("#aFilter").value;
  const all = plants.filter(p =>
    (!q || deacc(norm(p.latin + " " + p.hu + " " + (p.aliases || []).join(" "))).includes(q)) &&
    (f !== "verify" || p.verify) && (f !== "nohu" || !p.hu) && (f !== "noimg" || !p.image));
  $("#aCount").textContent = all.length > 100 ? `${all.length} találat, az első 100 látszik — szűkíts kereséssel` : `${all.length} találat`;
  $("#aList").innerHTML = all.slice(0, 100).map(p => `<button class="row" data-id="${p.id}">
    ${p.image ? `<img loading="lazy" src="${esc(p.image)}" alt="">` : '<div class="noimg"></div>'}
    <div class="t"><i>${esc(p.latin)}</i><small>${esc(p.hu) || "nincs magyar név"}${p.verify ? ' · <span class="flag">ellenőrizendő</span>' : ""}</small></div></button>`).join("");
}
function openEditor(id) {
  const p = plants.find(x => x.id === id);
  let newImg = null, addImg = null, more = [...(p.more || [])];
  const el = $("#aEdit");
  el.classList.remove("hidden");
  el.innerHTML = `
    <div class="photo" id="ePhoto">${p.image ? `<img src="${esc(p.image)}" alt="${esc(p.latin)}">` : '<p class="empty">Nincs kép — tölts fel egyet lent.</p>'}</div>
    <label for="eFile">Fő kép cseréje</label><input type="file" accept="image/*" id="eFile">
    <label>További képek (gyakorlásnál véletlenszerűen váltakoznak)</label>
    <div class="thumbs" id="eMore"></div>
    <label for="eAdd">Kép hozzáadása</label><input type="file" accept="image/*" id="eAdd">
    <label for="eLat">Latin név</label><input type="text" id="eLat" value="${esc(p.latin)}" spellcheck="false">
    <label for="eHu">Hivatalos magyar név</label><input type="text" id="eHu" value="${esc(p.hu)}" spellcheck="false">
    <label for="eAli">Más elfogadott nevek (vesszővel)</label><input type="text" id="eAli" value="${esc((p.aliases || []).join(", "))}" spellcheck="false">
    <label for="eNote">Jegyzet</label><textarea id="eNote" rows="2">${esc(p.note)}</textarea>
    <label class="check"><input type="checkbox" id="eVer" ${p.verify ? "" : "checked"}> A magyar név ellenőrizve</label>
    <div class="actions"><button class="btn soft" id="eClose">Bezár</button><button class="btn go" id="eSave">Mentés</button></div>
    <p class="msg" id="eMsg" aria-live="polite"></p>`;
  el.scrollIntoView({ behavior: "smooth", block: "start" });
  $("#eFile").onchange = async e => { if (!e.target.files[0]) return; newImg = await resizeToJpeg(e.target.files[0]); $("#ePhoto").innerHTML = `<img src="${newImg.url}" alt="Új kép">`; };
  const drawMore = () => {
    $("#eMore").innerHTML = more.map((m, i) => `<div class="thumb"><img src="${esc(m.image)}" alt="További kép ${i + 1}">
      <button data-i="${i}" aria-label="Kép ${i + 1} törlése"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>`).join("")
      + (addImg ? `<div class="thumb"><img src="${addImg.url}" alt="Új kép"></div>` : "")
      || '<p class="muted">Nincs további kép.</p>';
  };
  drawMore();
  $("#eMore").onclick = e => { const b = e.target.closest("button[data-i]"); if (b) { more.splice(+b.dataset.i, 1); drawMore(); } };
  $("#eAdd").onchange = async e => { if (!e.target.files[0]) return; addImg = await resizeToJpeg(e.target.files[0]); drawMore(); };
  $("#eClose").onclick = () => el.classList.add("hidden");
  $("#eSave").onclick = async () => {
    const msg = t => $("#eMsg").textContent = t;
    if (!tok()) return msg("Előbb add meg a GitHub tokent fent.");
    try {
      $("#eSave").disabled = true;
      const patch = {
        latin: $("#eLat").value.trim(), hu: $("#eHu").value.trim(), note: $("#eNote").value.trim(),
        aliases: $("#eAli").value.split(",").map(s => s.trim()).filter(Boolean), verify: !$("#eVer").checked,
      };
      if (newImg) {
        msg("Kép feltöltése…");
        // fresh random name: no cache shows the old photo, and the name doesn't give the answer away
        const path = `images/${crypto.randomUUID().slice(0, 12)}.jpg`;
        await gh(path, { method: "PUT", body: JSON.stringify({ message: `Kép csere: ${patch.latin}`, content: newImg.b64 }) });
        Object.assign(patch, { image: path, credit: "Saját feltöltés" });
      }
      if (addImg) {
        msg("Kép feltöltése…");
        const path = `images/${crypto.randomUUID().slice(0, 12)}.jpg`;
        await gh(path, { method: "PUT", body: JSON.stringify({ message: `Új kép: ${patch.latin}`, content: addImg.b64 }) });
        more.push({ image: path, credit: "Saját feltöltés" });
      }
      if (JSON.stringify(more) !== JSON.stringify(p.more || [])) patch.more = more;
      msg("Mentés…");
      // merge into the latest committed data.json so edits made on another device aren't lost
      const { sha, data } = await getDataFile();
      const target = data.find(x => x.id === p.id);
      Object.assign(target, patch);
      if (!target.verify) delete target.verify;
      const content = bytesToB64(new TextEncoder().encode(JSON.stringify(data, null, 1)));
      await gh("data.json", { method: "PUT", body: JSON.stringify({ message: `Javítás: ${patch.latin}`, content, sha }) });
      Object.assign(p, patch); if (!p.verify) delete p.verify;
      // Pages republishes in 1–2 min; until then this device re-applies the edit on every load
      const pending = store.get("pending", {});
      pending[p.id] = { patch, at: Date.now() };
      store.set("pending", pending);
      if (newImg) p.image = newImg.url;
      addImg = null; drawMore();
      msg("Mentve. A többi eszközön 1–2 perc múlva látszik.");
      renderAdminList();
    } catch (e) { msg("Nem sikerült: " + e.message); }
    finally { $("#eSave").disabled = false; }
  };
}

// ---------- boot ----------
function showTab(tab) {
  document.querySelectorAll(".tabs button").forEach(b => b.dataset.tab === tab ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  document.querySelectorAll("main > section").forEach(s => s.classList.toggle("hidden", s.id !== tab));
  store.set("tab", tab);
  if (detailId !== null) closeDetail();
  if (tab === "list") renderList();
  if (tab === "admin") renderAdminList();
  if (tab === "exam" && !exam) examStart();
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => showTab(b.dataset.tab));

// one-time setup link: …/#token=… stores the token and removes it from the address bar
if (location.hash.startsWith("#token=")) {
  store.set("ghToken", decodeURIComponent(location.hash.slice(7)));
  history.replaceState(null, "", location.pathname + location.search);
  store.set("tab", "admin");
}
function renderTokenState() {
  const has = !!store.get("ghToken", "");
  $("#tokSet").classList.toggle("hidden", !has);
  $("#tokUnset").classList.toggle("hidden", has);
  $("#aTok").value = store.get("ghToken", "");

  document.querySelector('.tabs [data-tab="admin"]').classList.toggle("hidden", !has);
  if (!has && store.get("tab") === "admin") showTab("play");
}
$("#aTok").onchange = () => { store.set("ghToken", $("#aTok").value.trim()); renderTokenState(); };
$("#tokForget").onclick = () => { store.set("ghToken", ""); renderTokenState(); };
$("#tokLink").onclick = async () => {
  const link = `${location.origin}${location.pathname}#token=${encodeURIComponent(store.get("ghToken", ""))}`;
  try { await navigator.clipboard.writeText(link); $("#tokMsg").textContent = "Link kimásolva. Küldd el magadnak, és nyisd meg a másik eszközön. Ne oszd meg mással!"; }
  catch { prompt("Másold ki ezt a linket:", link); }
};

// edits saved on this device but not yet visible in the published data.json
function applyPending(list) {
  const pending = store.get("pending", {});
  const same = (a, b) => JSON.stringify(a ?? false) === JSON.stringify(b ?? false);
  for (const [id, { patch, at }] of Object.entries(pending)) {
    const p = list.find(x => x.id === id);
    const published = p && Object.entries(patch).every(([k, v]) => same(p[k], v));
    if (!p || published || Date.now() - at > 864e5) { delete pending[id]; continue; }
    Object.assign(p, patch);
    if (!p.verify) delete p.verify;
  }
  store.set("pending", pending);
  return list;
}

fetch("data.json?v=" + Date.now()).then(r => r.json()).then(d => {
  plants = applyPending(d);
  renderTokenState();
  pullProgress();
  $("#lCat").innerHTML = `<option value="">Minden kategória (${plants.length})</option>` + categories().map(c => `<option>${esc(c)}</option>`).join("");
  $("#lQ").oninput = $("#lCat").onchange = renderList;
  $("#aQ").oninput = $("#aFilter").onchange = renderAdminList;
  $("#stats").onclick = e => {
    const s = e.target.closest(".stat");
    if (!s) return;
    settings.cat = s.dataset.cat; settings.round = "0"; saveSettings();
    showTab("play"); startRound(); window.scrollTo(0, 0);
  };
  $("#lGrid").onclick = e => { const t = e.target.closest(".tile"); if (t) openDetail(t.dataset.id); };
  $("#aList").onclick = e => { const t = e.target.closest(".row"); if (t) openEditor(t.dataset.id); };
  renderToday();
  startRound();
  showTab(["play", "exam", "list", "admin"].includes(store.get("tab")) ? store.get("tab") : "play");
}).catch(() => { $("#playArea").innerHTML = '<p class="empty">Nem sikerült betölteni a növénylistát. Frissítsd az oldalt.</p>'; });
